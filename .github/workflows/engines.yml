# Engine builds on every push to main: Windows debug (preset dev), Windows release, Linux release,
# the prebuilt Android engine (tools/stage_android.py),
# then the SDK with those engines staged into alpha-sdk/engine/<target>/ (as tools/stage_engine.py
# lays them out). Artifacts: the engines and the npm tarballs from tools/pack_release.py.
# The gates (tests, coverage, limits) stay in ci.yml; nothing here publishes (release.yml calls this
# workflow and publishes its sdk-release artifact).
name: engines

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# In a call, github.workflow is the caller's name, so release.yml never cancels this push's own run.
concurrency:
  group: ${{ github.workflow }}-engines-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
  # One game.jsbc key for every engine (cmake/BytecodeKey.cmake): the desktop release engine encrypts
  # what the shipping and Android engines decrypt. Without the secret each job picks its own key
  # (fine for these artifacts; pack_release then refuses the Android package and release.yml stops).
  ALPHA_JSBC_SECRET: ${{ secrets.ALPHA_JSBC_SECRET }}

jobs:
  windows-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: build/dev/_deps
          key: deps-windows-dev-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}
      - run: cmake --preset dev
      - run: cmake --build --preset dev --target alpha_star
      - name: Collect engine
        shell: bash
        run: |
          mkdir -p out
          exe=$(python -c "import sys; sys.path.insert(0, 'tools'); import toolchain; print(toolchain.built_exe('dev'))")
          cp "$exe" out/
          cp "${exe%.exe}.pdb" out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: engine-win32-x64-debug
          path: out/
          retention-days: 14

  # tools/stage_engine.py builds release + shipping and stages them (shipping only if check_shipping passes).
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - uses: actions/cache@v6
        with:
          path: |
            build/release/_deps
            build/shipping/_deps
          key: deps-windows-release-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}
      - run: python tools/stage_engine.py
      - uses: actions/upload-artifact@v7
        with:
          name: engine-win32-x64
          path: alpha-sdk/engine/win32-x64/
          retention-days: 14

  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - name: Install harness tools
        run: |
          python3 -m venv "$RUNNER_TEMP/harness"
          "$RUNNER_TEMP/harness/bin/pip" install -r tools/requirements.txt
          echo "$RUNNER_TEMP/harness/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            build/release/_deps
            build/shipping/_deps
          key: deps-linux-release-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}
      - run: python3 tools/stage_engine.py
      - uses: actions/upload-artifact@v7
        with:
          name: engine-linux-x64
          path: alpha-sdk/engine/linux-x64/
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: NDK and CMake pinned by alpha-sdk/android/app/build.gradle
        run: |
          ndk=$(sed -n 's/.*ndkVersion "\(.*\)".*/\1/p' alpha-sdk/android/app/build.gradle)
          cmake=$(sed -n 's/.*version "\([0-9.]*\)".*/\1/p' alpha-sdk/android/app/build.gradle | head -1)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "cmake;$cmake" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/$cmake/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            build/android-debug/_deps
            build/android-shipping/_deps
          key: deps-android-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}
      - run: python3 tools/stage_android.py
      - uses: actions/upload-artifact@v7
        with:
          name: engine-android-arm64
          path: alpha-sdk/engine/android-arm64/
          retention-days: 14

  sdk:
    needs: [windows-release, linux-release, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alpha-sdk/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: engine-win32-x64
          path: alpha-sdk/engine/win32-x64
      - uses: actions/download-artifact@v8
        with:
          name: engine-linux-x64
          path: alpha-sdk/engine/linux-x64
      - uses: actions/download-artifact@v8
        with:
          name: engine-android-arm64
          path: alpha-sdk/engine/android-arm64
      # Artifacts drop the executable bit.
      - run: chmod +x alpha-sdk/engine/linux-x64/alpha_star alpha-sdk/engine/linux-x64/glslang alpha-sdk/engine/linux-x64/shadercross alpha-sdk/engine/linux-x64/shipping/alpha_star
      - name: SDK tests
        working-directory: alpha-sdk
        run: |
          npm ci
          xvfb-run -a npm test
      - name: Sync templates from examples
        working-directory: alpha-sdk
        run: npm run templates
      - name: Pack (local tarballs + offline install test, not published)
        run: xvfb-run -a python3 tools/pack_release.py --install-test --require win32-x64 --require linux-x64 --require android-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-release
          path: dist/release/
          retention-days: 14
