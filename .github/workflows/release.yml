# Releases the SDK when a push to main carries a new alpha-sdk/package.json version (bump it with
# CMakeLists.txt and CHANGELOG.md; tools/pack_release.py refuses mismatches). Steps:
#   1. version: read the version; stop if v<version> is already tagged or on npm.
#   2. engines.yml: Windows + Linux release/shipping engines, the prebuilt Android engine, SDK tests, tarballs (templates synced,
#      skills copied by prepack, llm docs, notices), offline install test of all three packages.
#   3. publish: engine packages first (the SDK's exact-version optionalDependencies), then the SDK,
#      with npm provenance; then tag v<version> and a GitHub release with the tarballs.
# Every binary in the packages is built here, never on a developer machine.
# Repository secrets: NPM_TOKEN (npm automation token with publish rights on the @alpha-star scope)
# and ALPHA_JSBC_SECRET (any long random string, kept forever: the game.jsbc key of every engine).
# The docs site deploys on its own (pages.yml).
name: release

on:
  push:
    branches: [main]
    paths: ["alpha-sdk/package.json"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: v
        env:
          HAS_SECRETS: ${{ secrets.NPM_TOKEN != '' && secrets.ALPHA_JSBC_SECRET != '' }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::error::set the repository secrets NPM_TOKEN and ALPHA_JSBC_SECRET to release"; exit 1
          fi
          version=$(node -p "require('./alpha-sdk/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged: nothing to release"; echo "release=false" >> "$GITHUB_OUTPUT"
          elif npm view "@alpha-star/sdk@$version" version >/dev/null 2>&1; then
            echo "@alpha-star/sdk@$version is already on npm: nothing to release"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing $version"; echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/engines.yml
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write   # tag + GitHub release
      id-token: write   # npm provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: sdk-release
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: engine-win32-x64
          path: engines/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux-x64
          path: engines/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: engine-android-arm64
          path: engines/android-arm64
      - name: Publish to npm (engines, then SDK)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd dist/release
          for pkg in alpha-star-engine-win32-x64 alpha-star-engine-linux-x64 alpha-star-engine-android-arm64 alpha-star-sdk; do
            name="@${pkg/alpha-star-/alpha-star/}"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published (rerun): skipped"; continue
            fi
            npm publish "$pkg-$VERSION.tgz" --access public --provenance
          done
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd engines/win32-x64 && zip -qr "../../alpha-star-engine-win32-x64-$VERSION.zip" .)
          (cd engines/android-arm64 && zip -qr "../../alpha-star-engine-android-arm64-$VERSION.zip" .)
          (cd engines/linux-x64 && chmod +x alpha_star glslang shipping/alpha_star && tar czf "../../alpha-star-engine-linux-x64-$VERSION.tar.gz" .)
          notes=$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "alpha-star $VERSION" --notes "$notes" \
            dist/release/*.tgz dist/release/MANIFEST.txt \
            "alpha-star-engine-win32-x64-$VERSION.zip" "alpha-star-engine-linux-x64-$VERSION.tar.gz" \
            "alpha-star-engine-android-arm64-$VERSION.zip"
