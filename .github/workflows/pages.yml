# Publishes the docs site (docs/site, built by `npm --prefix alpha-sdk run docs`) to GitHub Pages.
name: docs-pages

on:
  push:
    branches: [main]
    paths: ["docs/guide/**", "alpha-sdk/types/**", "alpha-sdk/scripts/**", "aster.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix alpha-sdk ci
      - run: npm --prefix alpha-sdk run docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
