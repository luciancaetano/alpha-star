plugins {
    id 'com.android.application'
}

// The engine is built from source with the shipping flavor (no dev tools, MCP or
// debug features), arm64-v8a only. The game pack is in src/main/assets.
android {
    namespace = "org.libsdl.app"
    compileSdk 35
    buildToolsVersion "36.0.0"
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "{{PACKAGE}}"
        minSdk 21
        targetSdk 35
        versionCode {{VERSION_CODE}}
        versionName "{{VERSION_NAME}}"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static",
                          "-DALPHA_SHIPPING=ON", "-DALPHA_BUILD_TESTS=OFF", "-DCMAKE_BUILD_TYPE=Release"
                targets "alpha_star"
            }
        }
    }
    // Release keystore from the environment (never stored in the project):
    // ALPHA_ANDROID_KEYSTORE (path), ALPHA_ANDROID_KEYSTORE_PASSWORD, ALPHA_ANDROID_KEY_ALIAS,
    // ALPHA_ANDROID_KEY_PASSWORD. Without them the APK is debug-signed (installs with adb).
    def keystore = System.getenv("ALPHA_ANDROID_KEYSTORE")
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("ALPHA_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ALPHA_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ALPHA_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path file("{{ENGINE_CMAKE}}")
            version "3.31.6"
        }
    }
    androidResources {
        noCompress += ['js', 'json', 'ogg', 'mp3', 'wav', 'png', 'fnt', 'ttf', 'otf', 'rml', 'rcss']
    }
    lint {
        abortOnError = false
    }
}
